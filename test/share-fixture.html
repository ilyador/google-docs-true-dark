<!doctype html>
<html lang="en" data-gdt-share-fixture>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Panel Theme Fixture</title>
    <link rel="stylesheet" href="../src/share-dark.css">
    <style>
      body { margin: 0; min-height: 100vh; background: #fff; color: #202124; font: 14px Arial, sans-serif; }
      .overlay { display: grid; min-height: 100vh; place-items: center; background: #fff; }
      .fixture-share-panel { width: min(500px, calc(100vw - 32px)); padding: 24px; border: 1px solid #dadce0; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px #0002; }
      .top, .row, .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h2 { margin: 0 0 18px; font-size: 20px; font-weight: 500; }
      h3 { margin: 24px 0 14px; font-size: 14px; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #747775; border-radius: 4px; background: #fff; color: #202124; }
      .I9OJHe { position: relative; height: 50px; border: 1px solid #747775; border-radius: 4px; background: #fff; }
      .QVyFTd, .zHQkBf, .NtoL8e, .YMNIz { height: 100%; background: #fff; }
      .snByac { position: absolute; top: 15px; left: 12px; padding: 0 4px; background: #fff; color: #5f6368; white-space: nowrap; }
      .I9OJHe[data-floating="true"] .snByac { top: -9px; }
      .CeSLIf, .o8tTsf { background: #fff; }
      .I9OJHe input { height: 100%; border: 0; background: #fff; }
      .fixture-suggestions { margin: 0; padding: 6px 0; list-style: none; border: 1px solid #dadce0; background: #f1f6ff; }
      .fixture-suggestions [role="option"] { padding: 12px 16px; background: #f1f6ff; color: #202124; }
      .fixture-suggestion-content { width: 100%; height: 34px; background: #f1f6ff; }
      .fixture-suggestion-avatar { display: inline-grid; width: 32px; height: 32px; place-items: center; margin-right: 12px; border-radius: 50%; background: #5869ba; color: white; }
      .fixture-access-row { padding: 12px 0; border-top: 1px solid #fff; border-bottom: 1px solid #fff; }
      .fixture-general-access { display: flex; align-items: center; gap: 12px; }
      .fixture-restricted-icon { display: grid; flex: 0 0 32px; width: 32px; height: 32px; place-items: center; border-radius: 50%; background: #f4f6fb; color: #fff; }
      .fixture-pseudo-field { position: fixed; left: -1000px; top: 0; width: 500px; min-height: 46px; padding: 8px 12px; background: #fff; }
      .fixture-pseudo-field .YMNIz::after { content: "Add people, groups, spaces, and calendar events"; display: inline-block; background: #fff; color: #5f6368; }
      .fixture-nested-placeholder { width: 350px; height: 28px; padding: 3px 4px; background: #fff; color: #5f6368; }
      small { color: #5f6368; }
      button { padding: 8px 18px; border: 1px solid #747775; border-radius: 18px; background: transparent; color: #1a73e8; }
      .primary { background: #0b57d0; color: white; border-color: #0b57d0; }
      .footer { margin-top: 28px; }
    </style>
  </head>
  <body>
    <div class="overlay">
      <c-wiz class="fixture-share-app">
      <div class="fixture-share-panel" aria-label="Share document">
        <div class="top"><h2>Share "LXRP"</h2><span>Settings</span></div>
        <div class="I9OJHe">
          <div class="QVyFTd">
            <label class="snByac" for="fixture-mail-input"><span class="CeSLIf"><span class="o8tTsf">Add people, groups, spaces, and calendar events</span></span></label>
            <div class="zHQkBf"><div class="NtoL8e"><div role="grid"><div class="YMNIz">
              <input id="fixture-mail-input" role="combobox" aria-label="Add people, groups, spaces, and calendar events" aria-controls="fixture-suggestions">
            </div></div></div></div>
          </div>
        </div>
        <ul class="fixture-suggestions" id="fixture-suggestions" role="listbox">
          <li role="option"><div class="fixture-suggestion-content"><span class="fixture-suggestion-avatar">F</span>First contact</div></li>
          <li role="option"><div class="fixture-suggestion-content"><span class="fixture-suggestion-avatar">S</span>Second contact</div></li>
        </ul>
        <div class="fixture-pseudo-field yid0mf" role="combobox" aria-label="Add people alternative">
          <div><div><div class="fixture-nested-placeholder YMNIz"></div></div></div>
        </div>
        <h3>People with access</h3>
        <div class="row fixture-access-row"><span>Ilya Dorman (you)<br><small>Owner</small></span><small>Owner</small></div>
        <h3>General access</h3>
        <div class="fixture-general-access"><span class="fixture-restricted-icon" aria-hidden="true">L</span><div>Restricted<br><small>Only people with access can open with the link</small></div></div>
        <div class="footer"><button>Copy link</button><button class="primary">Done</button></div>
      </div>
      </c-wiz>
    </div>
    <script src="../src/share-controller.js"></script>
  </body>
</html>
