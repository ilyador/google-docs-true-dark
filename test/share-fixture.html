<!doctype html>
<html lang="en" data-gdt-share-fixture>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Share Panel Theme Fixture</title>
    <link rel="stylesheet" href="../src/share-dark.css">
    <style>
      body { margin: 0; min-height: 100vh; background: #fff; color: #202124; font: 14px Arial, sans-serif; }
      .overlay { display: grid; min-height: 100vh; place-items: center; background: #fff; }
      .fixture-share-panel { width: min(500px, calc(100vw - 32px)); padding: 24px; border: 1px solid #dadce0; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px #0002; }
      .top, .row, .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      h2 { margin: 0 0 18px; font-size: 20px; font-weight: 500; }
      h3 { margin: 24px 0 14px; font-size: 14px; }
      input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #747775; border-radius: 4px; background: #fff; color: #202124; }
      .fixture-mail-field { position: relative; }
      .fixture-mail-placeholder { position: absolute; top: 12px; left: 12px; background: #fff; color: #5f6368; white-space: nowrap; }
      small { color: #5f6368; }
      button { padding: 8px 18px; border: 1px solid #747775; border-radius: 18px; background: transparent; color: #1a73e8; }
      .primary { background: #0b57d0; color: white; border-color: #0b57d0; }
      .footer { margin-top: 28px; }
    </style>
  </head>
  <body>
    <div class="overlay">
      <c-wiz class="fixture-share-app">
      <div class="fixture-share-panel" aria-label="Share document">
        <div class="top"><h2>Share "LXRP"</h2><span>Settings</span></div>
        <div class="fixture-mail-field" role="combobox" aria-label="Add people">
          <input aria-label="Add people">
          <span class="fixture-mail-placeholder">Add people, groups, spaces, and calendar events</span>
        </div>
        <h3>People with access</h3>
        <div class="row"><span>Ilya Dorman (you)<br><small>Owner</small></span><small>Owner</small></div>
        <h3>General access</h3>
        <div>Restricted<br><small>Only people with access can open with the link</small></div>
        <div class="footer"><button>Copy link</button><button class="primary">Done</button></div>
      </div>
      </c-wiz>
    </div>
    <script src="../src/share-controller.js"></script>
  </body>
</html>
